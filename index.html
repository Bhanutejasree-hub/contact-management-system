
<!DOCTYPE html>
<html>
<head>
    <title>Contact Management System</title>

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Contact Management System</h2>

    <div class="d-flex justify-content-between mb-3">

        <!-- Search Contact -->
        <form action="/contacts" method="GET" class="d-flex">
            <input type="text" name="search"
                   class="form-control"
                   placeholder="Search by name">

            <button class="btn btn-primary ms-2">Search</button>
        </form>

        <!-- Add Contact -->
        <div>
            <a href="/" class="btn btn-secondary">Home</a>

            <a href="/add" class="btn btn-success">+ Add Contact</a>
        </div>

    </div>

    <!-- Contacts Table -->
    <table class="table table-bordered table-striped">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for contact in contacts %}
            <tr>
                <td>{{ contact.id }}</td>
                <td>{{ contact.name }}</td>
                <td>{{ contact.phone }}</td>
                <td>{{ contact.email }}</td>
                <td>{{ contact.address }}</td>

                <td>
                    <a href="/edit/{{ contact.id }}"
                       class="btn btn-warning btn-sm">Edit</a>

                    <a href="/delete/{{ contact.id }}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Delete this contact?')">
                       Delete
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>

    </table>

    {% if not contacts %}
        <p class="text-center">No contacts found.</p>
    {% endif %}

</div>

</body>
</html>
